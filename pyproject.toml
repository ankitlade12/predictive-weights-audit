[project]
name = "ssm-causal"
version = "0.1.0"
description = "Audit of causal interpretations of predictive bottleneck weights"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "statsmodels>=0.14.0",
    "networkx>=3.0",
    "pandas>=2.0.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
baselines = ["tigramite>=5.2.0"]
climate = ["xarray>=2023.1.0", "netCDF4>=1.6.0"]
notebook = ["jupyter>=1.0.0", "ipywidgets>=8.0.0"]
dev = ["pytest>=7.0.0", "ruff>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests that run longer empirical checks"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
